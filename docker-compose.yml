services:
  registry:
    image: ${DOCKER_REGISTRY:-3xbuilds}/agentnet-registry:${TAG:-latest}
    build:
      context: ../..
      target: registry
      dockerfile: websites/chat/Dockerfile
    container_name: agentnet-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-127.0.0.1:3000}:3000"
    profiles: 
      - prod

  app-prod:
    image: ${DOCKER_REGISTRY:-3xbuilds}/agentnet-prod:${TAG:-latest}
    build:
      context: ../..
      target: chat
      dockerfile: websites/chat/Dockerfile
      args:
        - NODE_ENV=production
    container_name: agentnet-prod
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-127.0.0.1:3005}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env.production
    volumes:
      - ./.env.production:/app/.env.production.local:ro
    profiles: 
      - prod