services:
  registry:
    image: ${DOCKER_REGISTRY:-3xbuilds}/agentnet-registry:${TAG:-latest}
    build:
      context: .
      target: registry
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: agentnet-registry
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
    profiles: 
      - prod

  chat:
    image: ${DOCKER_REGISTRY:-3xbuilds}/agentnet-chat:${TAG:-latest}
    build:
      context: .
      target: chat
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: agentnet-chat
    env_file:
      - ./websites/chat/.env.production
    volumes:
      - ./websites/chat/.env.production:/app/.env:ro
      - ./websites/chat:/app
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - REGISTRY_URL=http://registry:3005
    depends_on:
      - registry
    profiles: 
      - prod
